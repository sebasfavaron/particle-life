<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Life Lab</title><link rel="stylesheet" href="src/style.css"></head>
<body>
<main><canvas id="world"></canvas><div id="hud"><b id="fps">— FPS</b><span id="frame">— ms</span><span id="pairs">uniform grid</span></div></main>
<aside>
  <header><h1>Particle Life</h1><p>Color rules become moving ecosystems.</p></header>
  <section class="actions"><button id="pause">Pause</button><button id="reset">Reset particles</button><button id="scan">Scan ahead</button></section>
  <section class="controls" id="controls">
    <label><span>Seed <span class="info-icon">ⓘ<span class="tip">Deterministic seed. Same seed + settings = same evolution</span></span></span> <input id="seed" type="text" value="clusters"></label>
    <label><span>Particles <span class="info-icon">ⓘ<span class="tip">Total particles. More = richer patterns but slower</span></span></span> <output id="countOut"></output><input id="count" type="range" min="1000" max="30000" step="1000" value="4000"></label>
    <label><span>Color classes <span class="info-icon">ⓘ<span class="tip">How many color types interact. More = complex matrix</span></span></span> <output id="typesOut"></output><input id="types" type="range" min="2" max="10" step="1" value="6"></label>
    <label><span>Interaction radius <span class="info-icon">ⓘ<span class="tip">How far a particle feels others. Larger = more pairs, heavier</span></span></span> <output id="radiusOut"></output><input id="radius" type="range" min="10" max="80" step="1" value="28"></label>
    <label><span>Damping <span class="info-icon">ⓘ<span class="tip">Velocity retention per step. 0.5 = snappy, 0.99 = floaty</span></span></span> <output id="dampingOut"></output><input id="damping" type="range" min="0.5" max="0.99" step="0.01" value="0.80"></label>
    <label><span>Force <span class="info-icon">ⓘ<span class="tip">Strength of attraction/repulsion. Higher = faster, chaotic</span></span></span> <output id="forceOut"></output><input id="force" type="range" min="0.005" max="0.15" step="0.005" value="0.045"></label>
    <label><span>dt <span class="info-icon">ⓘ<span class="tip">Simulation speed multiplier. Higher = faster but less accurate</span></span></span> <output id="dtOut"></output><input id="dt" type="range" min="0.1" max="2" step="0.1" value="1"></label>
    <label><span>Speed <span class="info-icon">ⓘ<span class="tip">Physics steps per rendered frame. 1 = normal, 100 = fast-forward</span></span></span> <output id="speedOut">1</output><input id="speed" type="range" min="1" max="100" step="1" value="1"></label>
    <label class="check"><input id="wrap" type="checkbox" checked>Wrap edges <span class="info-icon">ⓘ<span class="tip">Particles wrap around edges vs. bounce off</span></span></label>
  <div class="actions"><button id="nudge">Nudge parameters</button></div></section>
  <section><div class="section-title"><h2>Interaction matrix</h2><span>row feels column</span></div><div id="matrix"></div><div class="legend"><i>− repel</i><i>0 neutral</i><i>+ attract</i></div><div class="actions" style="margin-top:10px"><button id="randomize" class="primary">Randomize matrix</button><button id="rndmass">Randomize masses</button><button id="rndall">Randomize all</button></div></section>
  <section class="actions"><button id="zoomOut">−</button><span id="zoomLabel" style="color:#b9c7da">Zoom</span><button id="zoomIn">+</button>
<button id="share" class="primary">Copy URL</button><button id="forces" class="secondary">Show forces</button></section>
  <footer>Space: pause · R: randomize · grid cell size = interaction radius</footer>
</aside>
<script type="module" src="src/app.js"></script>
</body></html>
