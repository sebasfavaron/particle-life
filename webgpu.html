<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle Life WebGPU validation</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080b10; color: #e9eef7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(1200px, 100vw); padding: 12px; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
    h1 { margin: 0 auto 0 0; font-size: 1rem; }
    button, select { min-height: 34px; border: 1px solid #41506a; border-radius: 6px; background: #172033; color: inherit; padding: 0 12px; }
    button:disabled, select:disabled { opacity: .5; }
    label { display: flex; align-items: center; gap: 6px; color: #b9c6d9; font-size: .85rem; }
    #status, #metrics { width: 100%; color: #aebcd0; font: 12px/1.4 ui-monospace, monospace; }
    #metrics { color: #72e0b5; }
    #status[data-state="ready"] { color: #72e0b5; }
    #status[data-state="error"] { color: #ff9b9b; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; background: #000; border: 1px solid #263249; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>WebGPU validation</h1>
      <button id="run" type="button" disabled>Start</button>
      <button id="reset" type="button" disabled>Reset</button>
      <button id="oracle" type="button" disabled>Run physics checks</button>
      <label>Particles
        <select id="count" disabled>
          <option value="2000">2k</option>
          <option value="10000">10k</option>
          <option value="20000">20k</option>
          <option value="30000">30k</option>
        </select>
      </label>
      <div id="status" data-state="loading" role="status" aria-live="polite">Initializing CPU state, then requesting WebGPU…</div>
      <div id="metrics" aria-live="polite">Metrics pending</div>
    </header>
    <canvas id="world" width="1200" height="800" aria-label="Particle Life WebGPU canvas"></canvas>
  </main>

  <script type="module">
    import { ParticleLife } from './src/engine.js';
    import {
      WebGpuParticleLifeBackend,
      WebGpuAvailabilityError,
    } from './src/webgpu/webgpu-backend.js';

    const WORLD_WIDTH = 1200;
    const WORLD_HEIGHT = 800;
    const TICK_HZ = 30;
    const canvas = document.querySelector('#world');
    const runButton = document.querySelector('#run');
    const resetButton = document.querySelector('#reset');
    const oracleButton = document.querySelector('#oracle');
    const countSelect = document.querySelector('#count');
    const status = document.querySelector('#status');
    const metrics = document.querySelector('#metrics');

    let backend = null;
    let timer = null;
    let running = false;
    let metricWindowStarted = performance.now(), metricTicks = 0, submitSamples = [], queueDelayMs = null;

    function resetMetrics() {
      metricWindowStarted = performance.now(); metricTicks = 0; submitSamples = []; queueDelayMs = null;
      metrics.textContent = 'Metrics warming up…';
    }
    async function recordTick() {
      const submittedAt = performance.now();
      backend.stepMany(1); backend.render();
      submitSamples.push(performance.now() - submittedAt);
      // Validation mode deliberately waits. This reports sustainable GPU work, not queued work.
      queueDelayMs = await backend.waitForIdle();
      metricTicks++;
      const now = performance.now();
      if (now - metricWindowStarted < 1000) return;
      submitSamples.sort((a, b) => a - b);
      const p95 = submitSamples[Math.floor(submitSamples.length * .95)] ?? 0;
      const ticksPerSecond = metricTicks * 1000 / (now - metricWindowStarted);
      metrics.textContent = `${ticksPerSecond.toFixed(1)} sustainable ticks/s · submit p95 ${p95.toFixed(2)} ms · GPU tick ${queueDelayMs.toFixed(1)} ms`;
      metricWindowStarted = now; metricTicks = 0; submitSamples = [];
    }
    async function scheduleTick() {
      if (!running) return;
      const started = performance.now();
      try {
        await recordTick();
      } catch (error) {
        failDuringRun(error);
        return;
      }
      if (!running) return;
      timer = window.setTimeout(scheduleTick, Math.max(0, 1000 / TICK_HZ - (performance.now() - started)));
    }

    function setStatus(message, state = 'ready') {
      status.textContent = message;
      status.dataset.state = state;
    }

    function makeCpuUpload(particleCount) {
      // The CPU engine remains the single source of the initialized validation state.
      const engine = new ParticleLife({
        width: WORLD_WIDTH,
        height: WORLD_HEIGHT,
        count: particleCount,
      });
      const { x, y, vx, vy, kind, matrix, masses, drawOrder } = engine;
      const states = new Float32Array(particleCount * 4);
      for (let i = 0; i < particleCount; i += 1) {
        states[i * 4] = x[i];
        states[i * 4 + 1] = y[i];
        states[i * 4 + 2] = vx[i];
        states[i * 4 + 3] = vy[i];
      }

      return {
        width: engine.width,
        height: engine.height,
        count: engine.count,
        types: engine.types,
        radius: engine.radius,
        force: engine.force,
        damping: engine.damping,
        dt: engine.dt,
        beta: engine.beta,
        wrap: engine.wrap,
        states,
        kinds: Uint32Array.from(kind),
        matrix,
        masses,
        drawOrder,
      };
    }

    function stop() {
      if (timer !== null) window.clearTimeout(timer);
      timer = null;
      running = false;
      runButton.textContent = 'Start';
    }

    function failDuringRun(error) {
      stop();
      runButton.disabled = true;
      resetButton.disabled = true;
      oracleButton.disabled = true;
      countSelect.disabled = true;
      setStatus(`WebGPU error — simulation stopped: ${error.message}`, 'error');
    }

    function start() {
      if (!backend || running) return;
      running = true;
      runButton.textContent = 'Pause';
      resetMetrics();
      setStatus(`WebGPU active · ${countSelect.selectedOptions[0].textContent} particles · fixed ${TICK_HZ} Hz`);
      scheduleTick();
    }

    function resetFromCpu() {
      if (!backend) return;
      const upload = makeCpuUpload(Number(countSelect.value));
      backend.reset(upload);
      backend.render();
      resetMetrics();
      setStatus(`WebGPU ${running ? 'active' : 'paused'} · CPU state uploaded exactly · ${upload.count.toLocaleString()} particles`);
    }

    function makeOracleEngine(testCase) {
      const engine = new ParticleLife({
        width: testCase.width, height: testCase.height, count: 2, types: testCase.types,
        radius: testCase.radius, force: testCase.force, damping: testCase.damping, dt: testCase.dt,
        wrap: testCase.wrap, seed: `oracle-${testCase.name}`,
      });
      engine.x.set(testCase.x); engine.y.set(testCase.y); engine.vx.set(testCase.vx); engine.vy.set(testCase.vy);
      engine.kind.set(testCase.kinds); engine.matrix.set(testCase.matrix); engine.masses.set(testCase.masses);
      return engine;
    }
    function interleavedState(engine) {
      const state = new Float32Array(engine.count * 4);
      for (let i = 0; i < engine.count; i++) {
        state[i * 4] = engine.x[i]; state[i * 4 + 1] = engine.y[i];
        state[i * 4 + 2] = engine.vx[i]; state[i * 4 + 3] = engine.vy[i];
      }
      return state;
    }
    async function runPhysicsChecks() {
      if (!backend) return;
      const wasRunning = running; stop(); oracleButton.disabled = true;
      const cases = [
        { name: 'asymmetric matrix', width: 120, height: 100, types: 2, radius: 80, force: .02, damping: .7, dt: 1, wrap: true, x: [30, 70], y: [50, 50], vx: [0, 0], vy: [0, 0], kinds: [0, 1], matrix: [0, .9, -.4, 0], masses: [1, 1] },
        { name: 'universal short-range repulsion', width: 120, height: 100, types: 2, radius: 80, force: .02, damping: .7, dt: 1, wrap: true, x: [50, 60], y: [50, 50], vx: [0, 0], vy: [0, 0], kinds: [0, 1], matrix: [0, 0, 0, 0], masses: [1, 1.5] },
        { name: 'one-cell wrapped world', width: 50, height: 50, types: 1, radius: 60, force: .02, damping: .7, dt: 1, wrap: true, x: [2, 48], y: [25, 25], vx: [0, 0], vy: [0, 0], kinds: [0, 0], matrix: [0], masses: [1] },
        { name: 'non-wrap bounce', width: 100, height: 80, types: 1, radius: 10, force: .02, damping: .7, dt: 1, wrap: false, x: [95, 20], y: [40, 40], vx: [10, 0], vy: [0, 0], kinds: [0, 0], matrix: [0], masses: [1] },
      ];
      let result = '', resultState = 'ready';
      try {
        for (const testCase of cases) {
          const cpu = makeOracleEngine(testCase), input = interleavedState(cpu);
          cpu.step();
          backend.reset({
            width: testCase.width, height: testCase.height, count: 2, types: testCase.types,
            radius: testCase.radius, force: testCase.force, damping: testCase.damping, dt: testCase.dt,
            wrap: testCase.wrap, states: input, kinds: Uint32Array.from(testCase.kinds),
            drawOrder: new Uint32Array([0, 1]), matrix: Float32Array.from(testCase.matrix), masses: Float32Array.from(testCase.masses),
          });
          backend.stepMany(1); await backend.waitForIdle();
          const gpu = await backend.readStateForValidation(), expected = interleavedState(cpu);
          let maxError = 0;
          for (let i = 0; i < gpu.length; i++) maxError = Math.max(maxError, Math.abs(gpu[i] - expected[i]));
          if (maxError > 1e-4) throw new Error(`${testCase.name}: max error ${maxError}`);
        }
        result = 'Physics checks passed · asymmetric, short-range, wrap, bounce';
      } catch (error) {
        result = `Physics checks failed: ${error.message}`; resultState = 'error';
      } finally {
        resetFromCpu(); oracleButton.disabled = false;
        setStatus(result, resultState);
        if (wasRunning) start();
      }
    }

    runButton.addEventListener('click', () => {
      if (running) {
        stop();
        setStatus('WebGPU paused');
      } else {
        start();
      }
    });
    resetButton.addEventListener('click', resetFromCpu);
    oracleButton.addEventListener('click', runPhysicsChecks);
    countSelect.addEventListener('change', resetFromCpu);

    async function initialize() {
      const upload = makeCpuUpload(Number(countSelect.value));
      try {
        backend = await WebGpuParticleLifeBackend.create(canvas, {
          ...upload,
          reset: upload,
          onDeviceLost(metadata) {
            stop();
            runButton.disabled = true;
            resetButton.disabled = true;
            oracleButton.disabled = true;
            countSelect.disabled = true;
            setStatus(`CPU fallback / device unavailable — simulation stopped (${metadata.lossReason})`, 'error');
          },
        });
        runButton.disabled = false;
        resetButton.disabled = false;
        oracleButton.disabled = false;
        countSelect.disabled = false;
        backend.render();
        start();
      } catch (error) {
        stop();
        const code = error instanceof WebGpuAvailabilityError ? error.code : '';
        const unavailable = code === 'adapter-unavailable'
          || code === 'adapter-request-failed'
          || code === 'device-unavailable'
          || code === 'device-request-failed'
          || code === 'api-unavailable'
          || code === 'api-incomplete';
        if (unavailable) {
          setStatus(`CPU fallback / adapter unavailable — simulation not running (${code})`, 'error');
        } else {
          setStatus(`WebGPU initialization failed — simulation not running: ${error.message}`, 'error');
        }
      }
    }

    window.addEventListener('beforeunload', () => {
      stop();
      backend?.destroy();
    });

    initialize();
  </script>
</body>
</html>
